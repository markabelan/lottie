<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Band folding and two rotations</title><style>
@font-face{font-family:Pangram;src:local('Pangram Medium'),local('Pangram-Medium'),local('PPPangramSans-Medium'),local('PP Pangram Sans Medium');font-weight:500;font-display:swap}
html,body{margin:0;background:transparent}main{width:560px;max-width:100%;margin:auto}canvas{display:block;width:100%;aspect-ratio:560/277;background:transparent}
</style></head><body><main><canvas id="band" aria-label="Labelled horizontal ballot band folding and unfolding with upper-left lighting and viewer-facing openings"></canvas></main><script>
(()=>{
const canvas=document.getElementById('band'),ctx=canvas.getContext('2d',{alpha:true});
const colors=[[244,244,226],[227,246,235],[255,235,214],[233,246,249],[247,232,249],[255,230,229]].map(c=>c.map(v=>v/255));
const ink=['#b7b67c','#71c199','#f69100','#48a0c4','#c48cca','#f38c98'],ballots=[4,3,1,2,5,6];
const rest=Array.from({length:8},(_,i)=>[Math.floor(i/2)*.5+i%2-1.25,Math.floor(i/2)*Math.sqrt(3)/2-3*Math.sqrt(3)/4,0]).map(([x,y,z])=>[x*.5+y*Math.sqrt(3)/2,-x*Math.sqrt(3)/2+y*.5,z]);
const faces=Array.from({length:6},(_,i)=>[i,i+1,i+2]);
const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const unit=a=>{const n=Math.hypot(...a);return a.map(v=>v/n)},smooth=t=>t*t*t*(t*(t*6-15)+10);
const family='Pangram, "PP Pangram Sans", Arial, sans-serif';
let width=1,height=1,start=null,textures=[];

function resize(){const r=canvas.getBoundingClientRect();width=r.width;height=r.height;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
new ResizeObserver(resize).observe(canvas);resize();
function fold(amount){const p=rest.map(v=>v.slice());for(let i=1;i<6;i++){const origin=p[i].slice(),axis=unit(sub(p[i+1],origin)),angle=(i%2?1:-1)*Math.acos(1/3)*amount,c=Math.cos(angle),s=Math.sin(angle);for(let j=i+2;j<8;j++){const v=sub(p[j],origin),av=cross(axis,v),d=dot(axis,v);p[j]=v.map((value,k)=>origin[k]+value*c+av[k]*s+axis[k]*d*(1-c))}}return p}
function project(p){const scale=width/4.4,f=5/(5-p[2]);return [(268.8+16.5)*width/560+p[0]*scale*f,136.2*width/560-p[1]*scale*f]}
function buildTextures(){textures=faces.map((f,i)=>{const tex=document.createElement('canvas');tex.width=640;tex.height=556;const tc=tex.getContext('2d'),minX=Math.min(...f.map(k=>rest[k][0])),maxY=Math.max(...f.map(k=>rest[k][1])),uv=f.map(k=>[(rest[k][0]-minX)*640,(maxY-rest[k][1])*640]);const center=uv.reduce((a,b)=>[a[0]+b[0]/3,a[1]+b[1]/3],[0,0]);tc.translate(...center);if(i%2===0)tc.rotate(Math.PI/3);tc.fillStyle=ink[i];tc.font='500 60px '+family;tc.textAlign='center';tc.textBaseline='middle';tc.fillText('BALLOT',0,-32);tc.fillText(String(ballots[i]),0,38);return {tex,uv}})}
buildTextures();document.fonts.load('500 24px Pangram').then(buildTextures).catch(()=>{});
function path(p){ctx.beginPath();ctx.moveTo(...p[0]);ctx.lineTo(...p[1]);ctx.lineTo(...p[2]);ctx.closePath()}
function textureTriangle(tex,uv,p){const u=sub(uv[1],uv[0]),v=sub(uv[2],uv[0]),x=sub(p[1],p[0]),y=sub(p[2],p[0]),det=u[0]*v[1]-u[1]*v[0];if(Math.abs(det)<1e-8)return;const a=(x[0]*v[1]-y[0]*u[1])/det,c=(y[0]*u[0]-x[0]*v[0])/det,b=(x[1]*v[1]-y[1]*u[1])/det,d=(y[1]*u[0]-x[1]*v[0])/det,e=p[0][0]-a*uv[0][0]-c*uv[0][1],g=p[0][1]-b*uv[0][0]-d*uv[0][1];ctx.save();const mid=p.reduce((s,q)=>[s[0]+q[0]/3,s[1]+q[1]/3],[0,0]);path(p.map(q=>{const dx=q[0]-mid[0],dy=q[1]-mid[1],n=Math.hypot(dx,dy)||1;return [q[0]+dx/n*.4,q[1]+dy/n*.4]}));ctx.clip();ctx.transform(a,b,c,d,e,g);ctx.drawImage(tex,0,0);ctx.restore()}
function paintBallot(i,points,screen){const {tex,uv}=textures[i],f=faces[i],u=sub(uv[1],uv[0]),v=sub(uv[2],uv[0]),det=u[0]*v[1]-u[1]*v[0],e1=sub(points[f[1]],points[f[0]]),e2=sub(points[f[2]],points[f[0]]);function map(q){const d=sub(q,uv[0]),s=(d[0]*v[1]-d[1]*v[0])/det,t=(u[0]*d[1]-u[1]*d[0])/det;return project(points[f[0]].map((n,k)=>n+s*e1[k]+t*e2[k]))}ctx.save();path(f.map(k=>screen[k]));ctx.clip();const N=6;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const a=[x*tex.width/N,y*tex.height/N],b=[(x+1)*tex.width/N,y*tex.height/N],c=[(x+1)*tex.width/N,(y+1)*tex.height/N],d=[x*tex.width/N,(y+1)*tex.height/N];textureTriangle(tex,[a,b,c],[map(a),map(b),map(c)]);textureTriangle(tex,[a,c,d],[map(a),map(c),map(d)])}ctx.restore()}

const names=['C>A','B>A','B>C','A>C','A>B','C>B','C>A','B>A'];
function visible(i,points){const camera=[0,0,5],ray=sub(points[i],camera);for(const f of faces){const a=points[f[0]],e1=sub(points[f[1]],a),e2=sub(points[f[2]],a),h=cross(ray,e2),det=dot(e1,h);if(Math.abs(det)<1e-9)continue;const inv=1/det,v=sub(camera,a),u=dot(v,h)*inv;if(u< -1e-7||u>1+1e-7)continue;const q=cross(v,e1),w=dot(ray,q)*inv;if(w< -1e-7||u+w>1+1e-7)continue;const t=dot(e2,q)*inv;if(t>1e-6&&t<1-1e-5)return false}return true}
function paintCorners(points,screen){const unit=width/546,size=17*unit;ctx.font='500 '+size+'px '+family;const merged=Math.hypot(...sub(points[0],points[6]))<.025,labels=[];for(let i=0;i<8;i++){if(merged&&i>=6)continue;if(!visible(i,points)&&!(merged&&i<2&&visible(i+6,points)))continue;const anchor=screen[i],dir=i%2?1:-1;labels.push({text:names[i],x:anchor[0],y:anchor[1]+dir*22*unit,w:ctx.measureText(names[i]).width})}for(let pass=0;pass<10;pass++)for(let i=0;i<labels.length;i++)for(let j=i+1;j<labels.length;j++){const a=labels[i],b=labels[j],ox=(a.w+b.w)/2+6*unit-Math.abs(a.x-b.x),oy=size*1.25-Math.abs(a.y-b.y);if(ox>0&&oy>0){const sign=a.y<b.y?-1:1;a.y+=sign*oy*.51;b.y-=sign*oy*.51}}ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';for(const l of labels){ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=2.5*unit;ctx.strokeText(l.text,l.x,l.y);ctx.fillStyle='#14191d';ctx.fillText(l.text,l.x,l.y)}}

function turn(v,axis,angle){const c=Math.cos(angle),s=Math.sin(angle),av=cross(axis,v),d=dot(axis,v);return v.map((x,k)=>x*c+av[k]*s+axis[k]*d*(1-c))}
const closed=fold(1),tubeAxis=unit([0,1,2].map(k=>(closed[0][k]+closed[2][k]+closed[4][k]-closed[1][k]-closed[3][k]-closed[5][k])/3));
const alignAxis=unit(cross(tubeAxis,[0,0,1])),alignAngle=Math.acos(Math.max(-1,Math.min(1,tubeAxis[2])));
function orient(v,amount){return turn(v,alignAxis,alignAngle*amount)}
const light=unit([-.35,.65,1]);
function frame(ms){if(start===null)start=ms;const seconds=(ms-start)/1000,t=seconds%23;let amount;if(t<.6)amount=0;else if(t<4.6)amount=smooth((t-.6)/4);else if(t<17.3)amount=1;else if(t<21.3)amount=1-smooth((t-17.3)/4);else amount=0;const labelAlpha=t<.6?1:t<2.1?1-smooth((t-.6)/1.5):t>=21.3?smooth(Math.min(1,(t-21.3)/.5)):0;const p=fold(amount),center=[0,0,0];for(const f of faces)for(const i of f)for(let k=0;k<3;k++)center[k]+=p[i][k]/18;const spinTime=Math.max(0,Math.min(12,t-4.8)),ramp=.6,spinProgress=(spinTime<ramp?spinTime*spinTime/(2*ramp):spinTime>12-ramp?12-ramp-(12-spinTime)*(12-spinTime)/(2*ramp):spinTime-ramp/2)/(12-ramp);const spin=4*Math.PI*spinProgress;const points=p.map(v=>turn(orient(sub(v,center),amount),[0,1,0],spin)),screen=points.map(project),order=faces.map((f,i)=>({f,i,z:f.reduce((s,k)=>s+points[k][2],0)/3})).sort((a,b)=>a.z-b.z);ctx.clearRect(0,0,width,height);for(const {f,i} of order){let normal=unit(cross(sub(points[f[1]],points[f[0]]),sub(points[f[2]],points[f[0]])));if(i%2===1)normal=normal.map(v=>-v);if(normal[2]<0)normal=normal.map(v=>-v);const litShade=.68+.32*Math.max(0,dot(normal,light));const shade=1+(litShade-1)*smooth(amount);path(f.map(k=>screen[k]));ctx.fillStyle='rgb('+colors[i].map(v=>Math.round(v*shade*255)).join(',')+')';ctx.fill();ctx.strokeStyle='#969696';ctx.lineWidth=width/560;ctx.lineJoin='round';ctx.stroke();if(labelAlpha>0){ctx.save();ctx.globalAlpha=labelAlpha;paintBallot(i,points,screen);ctx.restore()}}if(labelAlpha>0){ctx.save();ctx.globalAlpha=labelAlpha;paintCorners(points,screen);ctx.restore()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
